<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemical Products - Essentials</title>
  <style>
    :root {
      --bg: #ffffff;
      --page: #ffffff;
      --ink: #071426;
      --muted: #4a5568;
      --line: #c9d3df;
      --section: #f4f8fb;
      --accent: #061a33;
      --radius: 8px;
      --shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
      --tablet-page-width: 1080px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      line-height: 1.25;
    }

    body {
      padding: 6px;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: var(--tablet-page-width);
      min-height: 760px;
      margin: 0 auto 16px auto;
      background: var(--page);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 8px;
      overflow: visible;
      border: 2px solid var(--accent);
    }

    .home-strip {
      display: block;
      margin: -8px -8px 8px -8px;
      padding: 0;
      background: var(--accent);
      border-radius: 8px 8px 0 0;
      overflow: hidden;
    }

    .home-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 42px;
      padding: 10px 14px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: 0.08em;
      border: 0;
      border-bottom: 4px solid var(--accent-soft);
      line-height: 1;
    }

    .home-button:hover,
    .home-button:focus {
      background: #ffffff;
      color: var(--accent);
      outline: 3px solid var(--accent);
      outline-offset: -3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .product-lookup {
      margin: 0 0 8px 0;
      padding: 10px;
      background: var(--section);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .product-lookup-title {
      margin: 0 0 7px 0;
      color: var(--accent);
      font-size: 1.05rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .product-lookup-row {
      display: flex;
      gap: 7px;
      align-items: stretch;
    }

    .product-lookup-input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 44px;
      padding: 9px 11px;
      background: #ffffff;
      color: var(--ink);
      border: 2px solid var(--line);
      border-radius: 6px;
      font: inherit;
      font-weight: 700;
      text-transform: uppercase;
    }

    .product-lookup-input:focus {
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .product-lookup-input.lookup-not-found {
      border-color: #b42318;
    }

    .product-lookup-button {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 9px 18px;
      background: var(--accent);
      color: #ffffff;
      border: 2px solid var(--accent);
      border-radius: 6px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .product-lookup-button:hover,
    .product-lookup-button:focus {
      background: #ffffff;
      color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .product-lookup-message {
      min-height: 1.2em;
      margin-top: 5px;
      color: #b42318;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .mw-selector-feature {
      display: grid;
      grid-template-columns: minmax(220px, 34%) minmax(0, 1fr);
      min-height: 190px;
      margin-bottom: 10px;
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      background: var(--section);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .mw-selector-feature:hover,
    .mw-selector-feature:focus {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .mw-selector-image {
      min-height: 190px;
      background: #ffffff;
      border-right: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .mw-selector-image img {
      width: 100%;
      height: 185px;
      object-fit: contain;
    }

    .mw-selector-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px;
      background: var(--accent);
      color: #ffffff;
    }

    .mw-selector-copy strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.65rem;
      line-height: 1;
      font-weight: 900;
    }

    .mw-selector-copy span {
      display: block;
      font-size: 1rem;
      line-height: 1.25;
      font-weight: 700;
    }

    .mw-section-title {
      margin: 0 0 8px;
      padding: 8px 10px;
      background: var(--accent);
      color: #ffffff;
      border-radius: 6px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mw-category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .block,
    .site-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--ink);
      background: var(--section);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 210px;
      box-shadow: none;
    }

    .block:hover,
    .block:focus,
    .site-card:hover,
    .site-card:focus {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .block img,
    .site-card-image img,
    .image-placeholder {
      width: 100%;
      height: 150px;
      max-height: 150px;
      object-fit: contain;
      object-position: center center;
      background: #ffffff;
      padding: 6px;
      border: 0;
      border-bottom: 1px solid var(--line);
    }

    /* Equipment card image states; does not alter the original photo files. */
    .equipment-image-wrap {
      position: relative;
      width: 100%;
      height: 150px;
      background: #fff;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }

    .equipment-image-wrap img,
    .equipment-image-wrap .image-placeholder {
      width: 100%;
      height: 100%;
      max-height: none;
      border-bottom: 0;
    }

    .equipment-image-wrap .equipment-photo-muted {
      opacity: 0.8;
    }

    /* Compact transparent Preferred award, overlaid on the equipment image. */
    .preferred-ribbon {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      height: 32px;
      width: 85px;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      color: #72bf43;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .035em;
      line-height: 1;
      pointer-events: none;
    }

    .preferred-ribbon svg {
      display: block;
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .preferred-ribbon .preferred-label {
      white-space: nowrap;
    }


    .site-card-image {
      width: 100%;
      height: 150px;
      max-height: 150px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .site-card-image img {
      height: 100%;
      max-height: 100%;
      border-bottom: 0;
    }

    .image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
    }

    .block-title,
    .site-card-title {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 8px;
      text-align: center;
      font-size: 1rem;
      font-weight: 900;
      line-height: 1.08;
      color: #ffffff;
      background: var(--accent);
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 8px;
      padding: 8px;
      background: var(--section);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      font-size: 0.95rem;
    }

    .note p {
      margin: 0;
    }

    @media print {
      @page {
        size: Letter landscape;
        margin: 0.25in;
      }

      html,
      body {
        background: white;
        font-size: 15px;
      }

      body {
        padding: 0;
      }

      .page {
        width: 100%;
        max-width: none;
        min-height: 0;
        box-shadow: none;
        border-radius: 0;
        padding: 8px;
        margin: 0;
      }

      .home-strip {
        display: none;
      }

      .block,
      .site-card {
        break-inside: avoid;
        box-shadow: none;
      }
    }

    @media screen and (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media screen and (max-width: 560px) {
      body {
        padding: 5px;
        font-size: 16px;
      }

      .page {
        min-height: 0;
        padding: 6px;
        border-radius: 8px;
      }

      .home-strip {
        margin: -6px -6px 8px -6px;
      }

      .product-lookup-row {
        flex-direction: column;
      }

      .product-lookup-button {
        width: 100%;
      }

      .grid,
      .mw-category-grid {
        grid-template-columns: 1fr;
      }

      .mw-selector-feature {
        grid-template-columns: 1fr;
      }

      .mw-selector-image {
        min-height: 160px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .mw-selector-image img {
        height: 155px;
      }
    }
  </style>
</head>

        const input = document.getElementById('product-number-lookup');
        const button = document.getElementById('product-lookup-button');
        const message = document.getElementById('product-lookup-message');

        function lookUpProduct() {
          const entered = String(input.value || '').trim();
          const key = entered.toUpperCase();

          message.textContent = '';
          input.classList.remove('lookup-not-found');

          if (!key) {
            message.textContent = 'Enter an item code.';
            input.focus();
            return;
          }

          const href = products[key];

          if (!href) {
            message.textContent = 'Item code not found.';
            input.classList.add('lookup-not-found');
            input.select();
            return;
          }

          window.location.href = href;
        }

        button.addEventListener('click', lookUpProduct);
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            lookUpProduct();
          }
        });

        input.addEventListener('input', function () {
          message.textContent = '';
          input.classList.remove('lookup-not-found');
        });
      })();
